<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <script type="module" src="./src/main.js"></script>
    <title>newheaderv2</title>
  </head>
  <body>
    <section class="agro-hero">
      <div class="agro-hero__background"></div>
      <div class="agro-hero__overlay"></div>
      <div class="agro-hero__rings"></div>

      <div class="agro-hero__content">
        <div class="agro-hero__text">
          <div class="agro-hero__topics">
            <span>Territorio</span>
            <span>Producción</span>
            <span>Personas</span>
            <span>Datos</span>
            <span>Futuro</span>
          </div>

          <h1 class="agro-hero__title">
            <span class="agro-hero__title-line agro-hero__title-line--main">
              Censo
            </span>

            <span
              class="agro-hero__title-line agro-hero__title-line--secondary"
            >
              <strong>Agropecuario</strong>
              <em>2026</em>
            </span>
          </h1>

          <p class="agro-hero__subtitle">
            Conocemos hoy el campo que <strong>alimenta el mañana</strong>
          </p>
        </div>

        <div class="agro-window">
          <div class="agro-window__media">
            <div class="agro-window__video">
              <video autoplay muted loop playsinline>
                <source src="" type="video/webm" />
                <source src="" type="video/mp4" />
              </video>
            </div>
          </div>

          <div class="agro-window__shade"></div>

          <div class="agro-window__caption">
            <span>Territorio</span>
            <strong>Conoce el campo desde otra perspectiva</strong>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
